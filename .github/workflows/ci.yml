name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows minutes cost more on private repos, so pull requests run on Linux
        # and every push to main runs on both.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating major tag; Dependabot bumps it
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format check
        run: uv run poe lint

      - name: Type check
        run: uv run poe typecheck

      - name: Tests with coverage
        run: uv run poe test

  migrations:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: pitwall
          POSTGRES_DB: pitwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitwall -d pitwall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pitwall:pitwall@localhost:5432/pitwall
      TEST_DATABASE_URL: postgresql+psycopg://pitwall:pitwall@localhost:5432/pitwall
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Upgrade an empty database to the latest schema
        run: uv run alembic upgrade head

      - name: Models match the migrations (no autogenerate diff)
        run: uv run alembic check

      - name: Downgrade to empty, then upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Migration and constraint tests
        run: uv run pytest -m postgres --no-cov

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait until healthy
        run: |
          docker run --detach --name app --publish 8000:8000 app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy"
          docker logs app
          exit 1

      - name: Check the container runs as a non-root user
        run: test "$(docker exec app id -u)" != "0"

      - name: Check the migrations are in the image
        run: docker exec app alembic history | grep -q "0001"
